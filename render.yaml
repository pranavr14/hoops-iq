services:
  - type: web
    name: hoops-iq-api
    runtime: python
    plan: free
    region: ohio
    branch: feature/prediction-pipeline
    buildCommand: pip install -r requirements.txt && python scripts/download_runtime_assets.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: FRONTEND_ORIGINS
        value: https://hoops-iq-jet.vercel.app
